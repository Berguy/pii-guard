[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-guard"
version = "0.1.0"
description = "Scanner de secrets e PII para conformidade com LGPD"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.scripts]
pii-guard = "pii_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]